name: .NET 8 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore NextBus.sln

    - name: Build
      run: dotnet build NextBus.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test NextBus.sln --no-build --configuration Release --verbosity normal
